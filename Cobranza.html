<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Cobranza · 20–25 Jul</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#15803d;--okbg:#dcfce7;--amber:#b45309;--amberbg:#fef3c7;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:auto;padding-bottom:40px}
header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:14px 16px}
h1{margin:0;font-size:18px;font-weight:800}
.counter{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.counter div{flex:1;min-width:120px;background:#1f2937;border-radius:12px;padding:10px 12px}
.counter small{display:block;color:#9ca3af;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.counter b{font-size:22px}
.bar{height:8px;background:#374151;border-radius:99px;margin-top:10px;overflow:hidden}
.bar > i{display:block;height:100%;background:#22c55e;width:0;transition:width .3s}
main{padding:12px}
.floor{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.floor > summary{list-style:none;cursor:pointer;padding:15px 16px;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.floor > summary::-webkit-details-marker{display:none}
.floor > summary:before{content:"▶";font-size:12px;color:var(--muted);margin-right:6px}
.floor[open] > summary:before{content:"▼"}
.fmeta{font-size:13px;color:var(--muted);font-weight:700}
.store{border-top:1px solid var(--line)}
.storehead{display:flex;align-items:center;gap:12px;padding:13px 16px}
.check{width:34px;height:34px;flex:0 0 auto;border:2px solid #9ca3af;border-radius:9px;display:grid;place-items:center;background:#fff;font-size:20px;color:#fff}
.store.pagado .check{background:var(--ok);border-color:var(--ok)}
.store.parcial .check{background:var(--amber);border-color:var(--amber)}
.sname{flex:1;min-width:0;font-weight:800;font-size:16px}
.store.pagado .sname{text-decoration:line-through;color:var(--muted)}
.samt{font-weight:800;font-size:16px;text-align:right;white-space:nowrap}
.stag{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:8px}
.store.parcial .stag{background:var(--amberbg);color:var(--amber)}
.store.pagado .stag{background:var(--okbg);color:var(--ok)}
.detail{display:none;padding:0 16px 16px 62px;font-size:14px}
.store.open .detail{display:block}
.detail .line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);color:#374151}
.detail .anterior{color:var(--amber);font-weight:700}
.pay{margin-top:12px;background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:12px}
.pay label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.payrow{display:flex;gap:8px;margin-top:8px;align-items:center}
.payrow input{flex:1;min-width:0;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:18px;font-weight:800;text-align:center}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:800;font-size:14px;cursor:pointer}
.btn.exact{background:var(--ok);color:#fff}.btn.clear{background:#e5e7eb;color:#374151}
.result{margin-top:10px;font-weight:800;font-size:15px}
.result.vuelto{color:var(--blue)}.result.saldo{color:var(--amber)}
.reset{width:100%;margin-top:16px;background:#fff;border:1px solid var(--line);color:#b91c1c;border-radius:12px;padding:14px;font-weight:800;cursor:pointer}
.tools{margin-bottom:12px}.btn.add{width:100%;background:#2563eb;color:#fff}.addform{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{font-size:12px;font-weight:800;color:var(--muted)}.grid input,.grid select,.notearea,.promise{width:100%;margin-top:5px;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;color:var(--ink);background:#fff}.grid .wide{grid-column:1/-1}.formactions{display:flex;gap:8px;margin-top:10px}.notearea{min-height:65px;resize:vertical}.followup{margin-top:10px}.followup label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}.followrow{display:flex;gap:8px;margin-top:7px;align-items:center}.followrow .promise{margin:0;flex:1}.btn.later{background:#fef3c7;color:#92400e}.store.otro_dia .check{background:#f59e0b;border-color:#f59e0b}.store.otro_dia .stag{background:#fef3c7;color:#92400e}@media(max-width:560px){.grid{grid-template-columns:1fr}.grid .wide{grid-column:auto}.payrow,.followrow{flex-wrap:wrap}.payrow input{flex-basis:100%}}
</style></head>

  <div id="app"></div>
</main>
</div>

  const aliases=['Gisset','Gisset Flor','Flor Gisset'];
  const found=aliases.map(k=>state[k]).filter(Boolean);
  if(found.length){
    const received=found.reduce((a,x)=>a+Number(x.recibido||0),0);
    const notes=found.map(x=>x.note).filter(Boolean).join(' · ');
    const promised=found.map(x=>x.promisedDate).filter(Boolean).sort().pop()||'';
    const total=(APP_DATA.grupos.flatMap(g=>g.stores).find(s=>s.name==='Gisset Flor')||{}).total||0;
    state['Gisset Flor']={status:received>=total&&total>0?'pagado':received>0?'parcial':found.some(x=>x.status==='otro_dia')?'otro_dia':'pendiente',recibido:received,note:notes,promisedDate:promised};
    aliases.filter(k=>k!=='Gisset Flor').forEach(k=>delete state[k]);
  }
}
migrateAliases();
APP_DATA.grupos.forEach(g=>g.stores.forEach(s=>{if(s.paid&&!state[s.name])state[s.name]={status:'pagado',recibido:s.total,note:'',promisedDate:''}}));save();
function st(name){return state[canon(name)]||{status:'pendiente',recibido:0,note:'',promisedDate:''}}
function cobradoDe(s){const x=st(s.name);if(x.status==='pagado')return Math.min(Number(x.recibido||s.total),s.total);if(x.status==='parcial')return Math.min(Number(x.recibido||0),s.total);return 0}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
  APP_DATA=mergeData();
  const app=document.getElementById('app');app.innerHTML='';
  let all=[],grand=0,cob=0,done=0;
  APP_DATA.grupos.forEach(g=>g.stores.forEach(s=>{all.push(s);grand+=s.total;cob+=cobradoDe(s);const q=st(s.name).status;if(q==='pagado')done++}));
  APP_DATA.grupos.forEach(g=>{
    const pend=g.stores.reduce((a,s)=>a+(s.total-cobradoDe(s)),0);
    const falta=g.stores.filter(s=>st(s.name).status!=='pagado').length;
    const d=document.createElement('details');d.className='floor';
    d.innerHTML='<summary><span>'+esc(g.label)+'</span><span class="fmeta">'+money(pend)+' · faltan '+falta+'</span></summary>';
    g.stores.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>{
      const x=st(s.name);const saldo=Math.max(0,s.total-Number(x.recibido||0));
      const div=document.createElement('div');div.className='store '+x.status;div.dataset.name=s.name;
      let tag='';if(x.status==='pagado')tag='<span class="stag">Pagó</span>';else if(x.status==='parcial')tag='<span class="stag">Saldo '+money(saldo)+'</span>';else if(x.status==='otro_dia')tag='<span class="stag">Otro día'+(x.promisedDate?' · '+esc(x.promisedDate):'')+'</span>';
      let det='';Object.entries(s.days).forEach(([k,v])=>det+='<div class="line"><span>'+esc(k)+'</span><span>'+money(v)+'</span></div>');
      if(s.anterior>0)det+='<div class="line anterior"><span>Saldo anterior</span><span>'+money(s.anterior)+'</span></div>';
      det+='<div class="line" style="font-weight:800;color:#111827"><span>Total</span><span>'+money(s.total)+'</span></div>';
      let resHtml='';if(x.status==='pagado'&&x.recibido>s.total)resHtml='<div class="result vuelto">Vuelto: '+money(x.recibido-s.total)+'</div>';else if(x.status==='parcial')resHtml='<div class="result saldo">Falta: '+money(saldo)+'</div>';
      const icon=x.status==='pagado'?'✓':x.status==='parcial'?'½':x.status==='otro_dia'?'•':'';
      div.innerHTML='<div class="storehead"><div class="check" data-check>'+icon+'</div><div class="sname" data-open>'+esc(s.name)+tag+'</div><div class="samt">'+money(s.total)+'</div></div><div class="detail">'+det+'<div class="pay"><label>¿Con cuánto pagó?</label><div class="payrow"><input type="number" inputmode="decimal" placeholder="0" value="'+(x.recibido||'')+'" data-input><button class="btn exact" data-exact>Pagó exacto</button><button class="btn clear" data-clear>Borrar</button></div>'+resHtml+'<div class="followup"><label>Observación</label><textarea class="notearea" data-note placeholder="Ej. dijo que paga el lunes">'+esc(x.note||s.notes.join(' · '))+'</textarea><div class="followrow"><input class="promise" type="date" value="'+esc(x.promisedDate||'')+'" data-date><button class="btn later" data-later>Otro día</button></div></div></div></div>';
      d.appendChild(div);
    });app.appendChild(d);
  });
  const rb=document.createElement('button');rb.className='reset';rb.textContent='Cerrar cobranza (reiniciar pagos y notas)';rb.onclick=()=>{if(confirm('¿Borrar pagos, estados y observaciones? Las cuentas manuales se conservarán.')){const manual=state._manual;state={_manual:manual};save();render()}};app.appendChild(rb);
  document.getElementById('cCobrado').textContent=money(cob);document.getElementById('cFalta').textContent=money(grand-cob);document.getElementById('cTiendas').textContent=done+' / '+all.length;document.getElementById('cBar').style.width=(grand?Math.min(100,cob/grand*100):0)+'%';
}
function findStore(name){return APP_DATA.grupos.flatMap(g=>g.stores).find(x=>x.name===name)}
function reopen(name){const el=[...document.querySelectorAll('.store')].find(x=>x.dataset.name===name);if(el){el.closest('details').open=true;el.classList.add('open')}}
document.getElementById('app').addEventListener('click',e=>{
  const store=e.target.closest('.store');if(!store)return;const name=store.dataset.name;const s=findStore(name);const old=st(name);
  if(e.target.closest('[data-check]')){state[name]=old.status==='pagado'?{...old,status:'pendiente',recibido:0}:{...old,status:'pagado',recibido:s.total};save();render();return}
  if(e.target.closest('[data-open]')){store.classList.toggle('open');return}
  if(e.target.closest('[data-exact]')){state[name]={...old,status:'pagado',recibido:s.total};save();render();reopen(name);return}
  if(e.target.closest('[data-clear]')){state[name]={status:'pendiente',recibido:0,note:old.note||'',promisedDate:''};save();render();reopen(name);return}
  if(e.target.closest('[data-later]')){const date=store.querySelector('[data-date]').value;const note=store.querySelector('[data-note]').value.trim();state[name]={...old,status:'otro_dia',recibido:0,note,promisedDate:date};save();render();reopen(name);return}
});
document.getElementById('app').addEventListener('change',e=>{
  const store=e.target.closest('.store');if(!store)return;const name=store.dataset.name;const s=findStore(name);const old=st(name);
  if(e.target.matches('[data-input]')){const r=parseFloat(e.target.value)||0;state[name]={...old,status:r<=0?'pendiente':r>=s.total?'pagado':'parcial',recibido:r};save();render();reopen(name)}
  if(e.target.matches('[data-date]')){state[name]={...old,promisedDate:e.target.value};save()}
});
document.getElementById('app').addEventListener('input',e=>{if(e.target.matches('[data-note]')){const name=e.target.closest('.store').dataset.name;state[name]={...st(name),note:e.target.value};save()}});
document.getElementById('showAdd').onclick=()=>document.getElementById('addForm').hidden=false;
document.getElementById('cancelAdd').onclick=()=>document.getElementById('addForm').hidden=true;
document.getElementById('addForm').onsubmit=e=>{e.preventDefault();const name=canon(document.getElementById('newName').value);const amount=parseFloat(document.getElementById('newAmount').value);if(!name||!(amount>0))return;state._manual.push({id:Date.now(),name,amount,floor:document.getElementById('newFloor').value,concept:document.getElementById('newConcept').value.trim()||'Cuenta manual',note:document.getElementById('newNote').value.trim(),dateLabel:new Date().toLocaleDateString('es-PE')});save();e.target.reset();e.target.hidden=true;render();};
render();
render();
</script></body></html>
